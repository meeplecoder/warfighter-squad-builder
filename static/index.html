<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warfighter Squad Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Special+Elite&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="app-header">
    <div class="header-brand">★ <span data-i18n="app.title">Warfighter Squad Builder</span></div>
    <nav id="header-auth"></nav>
  </header>

  <div id="app-layout">
    <nav id="sidebar">
      <a href="#/cards"   class="nav-link" data-route="cards" data-i18n="nav.cards">Cards</a>
      <a href="#/squads"  class="nav-link" data-route="squads" data-i18n="nav.squads">Squads</a>
      <a href="#/builder" class="nav-link nav-sub" data-route="builder" id="nav-builder" data-i18n="nav.builder">Builder</a>
      <a href="#/generator" class="nav-link nav-sub" data-route="generator" id="nav-generator" data-i18n="nav.generator" style="display:none">Generator</a>
      <a href="#/campaigns" class="nav-link" data-route="campaigns"><span data-i18n="nav.campaigns">Campaigns</span> <span class="nav-beta" data-i18n="nav.beta">beta</span></a>
      <a href="#/campaigns/new" class="nav-link nav-sub" data-route="campaigns/new" id="nav-campaign-builder"><span data-i18n="nav.builder">Builder</span> <span class="nav-beta" data-i18n="nav.beta">beta</span></a>
      <a href="#/profile" class="nav-link" data-route="profile" id="nav-profile" data-i18n="nav.profile">Profile</a>
      <a href="#/translations" class="nav-link" data-route="translations" id="nav-translations" style="display:none" data-i18n="nav.translations">Translations</a>
    </nav>
    <main id="app-main">
      <div class="spinner-wrap"><div class="spinner"></div></div>
    </main>
  </div>

  <!-- Global card image hover thumbnail -->
  <div id="card-thumb"></div>

  <script src="/static/i18n.js"></script>
  <script src="/static/api.js"></script>
  <script src="/static/card_hover.js"></script>
  <script src="/static/search_clear.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/campaigns.js"></script>
  <script src="/static/generator.js"></script>
</body>
</html>
