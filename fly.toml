# fly.toml app configuration file generated for warfighterww2 on 2026-10-14T20:08:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'warfighterww2'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[env]
  APP_BASE_URL = 'https://warfighter-squad-builder.fly.dev'
  DATABASE_URL = 'sqlite:////data/warfighter.db'
  DEBUG = 'false'
  MAIL_BACKEND = 'resend'
  PROXY_FIX_HOPS = '1'

[[mounts]]
  source = 'wf_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
