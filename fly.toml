# Fly.io configuration — the only Fly-specific file besides .github/workflows/deploy.yml.
# See docs/deploy-fly.md. Other hosts: docs/deploy-docker.md.
app = "warfighterww2"
primary_region = "ams"        # change to the region nearest your players (fly platform regions)

[build]
  dockerfile = "Dockerfile"

[env]
  DEBUG = "false"
  PROXY_FIX_HOPS = "1"
  # Change if you use your own domain (then also `fly certs add your.domain`)
  APP_BASE_URL = "https://warfighterww2.fly.dev"
  MAIL_BACKEND = "resend"
  # Test sender: Resend delivers it only to the e-mail of your own Resend account. For real users verify a domain
  # in Resend and use e.g. "Warfighter WWII - Squad Builder <no-reply@your.domain>"
  MAIL_FROM = "Warfighter WWII - Squad Builder <onboarding@resend.dev>"
  # Secrets (never here):  fly secrets set SECRET_KEY=... RESEND_API_KEY=...

[mounts]
  source = "wf_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # always on; SQLite lives on the volume of this one machine
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[deploy]
  strategy = "immediate"         # canary/bluegreen do not work with a volume

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
